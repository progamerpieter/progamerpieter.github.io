     <script>
  gsap.registerPlugin(ScrollTrigger);
</script>
     <script>
// Footer pas laten verschijnen als alle boxes er staan
const footerHidden = !matchMedia("(prefers-reduced-motion: reduce)").matches;
if (footerHidden) gsap.set("#footer", { opacity: 0 });
const showFooter = () => {
  if (footerHidden) gsap.to("#footer", { opacity: 1, duration: 0.6 });
};
const lastBox = document.querySelectorAll(".box")[document.querySelectorAll(".box").length - 1];

// Desktop: alles animates on load (zoals nu)
if (window.innerWidth > 768) {
  gsap.to(".box", {
    y: 0,
    opacity: 1,
    duration: 0.6,
    stagger: 0.2,
    ease: "back.out(1.7)",
    onComplete: showFooter
  });
}

// Mobile: wacht tot in beeld; als meerdere tegelijk in beeld komen -> alsnog stagger
if (window.innerWidth <= 768) {
  ScrollTrigger.batch(".box", {
    start: "top 95%",
    once: true,
    onEnter: (batch) => {
      gsap.to(batch, {
        y: 0,
        opacity: 1,
        duration: 0.6,
        ease: "back.out(1.7)",
        stagger: 0.2,
        overwrite: "auto",
        // footer pas na de laatste box
        onComplete: batch.includes(lastBox) ? showFooter : undefined
      });
    }
  });
}
</script>
