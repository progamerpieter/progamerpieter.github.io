      </div>
    </main>
    <script>
        let timeLeft = 4;
        const countdownElement = document.getElementById('countdown');

        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                countdownElement.innerHTML = "0";
            } else {
                countdownElement.innerHTML = timeLeft;
                timeLeft--;
            }
        }, 1000);
    </script>
