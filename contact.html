      style="display: none"

    <main class="container hs-section">
      <div class="hs-head">
        <p class="hs-eyebrow">Contact</p>
        <h1 class="hs-title">Neem contact op</h1>
        <p class="hs-lead">Vertel kort wat je zoekt, dan neem ik zo snel mogelijk contact met je op.</p>
      </div>
      <div class="row g-4">
        <div class="col-12 col-lg-8">
          <form
            class="hs-card hs-form h-100"
            action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSfRwDZxLLXDuRfBd84TdK3Xro-f92cAMvqXiy6ammuMy3LvJw/formResponse"
            method="post"
            target="hiddenConfirm"
            onsubmit="submitted=true"
            id="contact_form"
          >
            <div class="row g-3">
              <div class="col-12 col-sm-6">
                <label class="form-label" for="voornaam">Voornaam</label>
                <input required id="voornaam" name="entry.2005620554" type="text" class="form-control" autocomplete="given-name" />
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label" for="achternaam">Achternaam</label>
                <input required id="achternaam" name="entry.1035776649" type="text" class="form-control" autocomplete="family-name" />
              </div>
              <div class="col-12">
                <label class="form-label" for="email">E-mail</label>
                <input required id="email" name="entry.123859892" type="email" class="form-control" autocomplete="email" />
              </div>
              <div class="col-12">
                <label class="form-label" for="bericht">Bericht</label>
                <textarea required id="bericht" name="entry.3142086" class="form-control" rows="5" placeholder="Bijvoorbeeld: een woningvideo voor een huis in Den Haag"></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary">Versturen</button>
              </div>
            </div>
          </form>
        </div>
        <div class="col-12 col-lg-4">
          <address class="hs-card h-100 mb-0">
            <h2 class="hs-card-title mt-0">Contactinformatie</h2>
            <ul class="hs-list mb-0">
              <li><a class="hs-link" href="mailto:info@pieterheidt.nl">info@pieterheidt.nl</a></li>
              <li><a class="hs-link" href="tel:+31619736853">06 19736853</a></li>
            </ul>
